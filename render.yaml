services:
  - type: web
    name: retro-raiders
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Optional. Without a key the local generator builds the dungeon.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_TEXT_MODEL
        value: qwen/qwen3.8-27b:free
      - key: OPENROUTER_MODEL_OPTIONS
        value: "qwen/qwen3.8-27b:free|Qwen 3.8 27B Free - structured,openrouter/free|OpenRouter Free Router - experimental,qwen/qwen3.6-plus:free|Qwen 3.6 Plus Free - creative,nvidia/nemotron-3.5-lightning:free|Nemotron 3.5 Lightning Free - punchy,inclusionai/ling-3.0-flash-fin:free|Ling 3.0 Flash Fin Free - colorful,google/gemma-4-31b-it:free|Gemma 4 31B Free - playful"
      # Optional paid avatar generation. Leave unset for local CSS/emoji avatars.
      - key: OPENROUTER_IMAGE_MODEL
        sync: false
      # Optional. Without these Markus gets "Download JSON" instead of saving.
      # Set the values in the Render dashboard, never in this file.
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_OWNER
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: GITHUB_BRANCH
        value: main
