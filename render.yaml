services:
  - type: web
    name: retro-raiders
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Optional. Without a key the local generator builds the dungeon.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_TEXT_MODEL
        value: openai/gpt-4o-mini
      - key: OPENROUTER_MODEL_OPTIONS
        value: "openai/gpt-4o-mini|GPT-4o mini - cheap solid default,openai/gpt-4.1-mini|GPT-4.1 mini - better wording,openai/gpt-4.1|GPT-4.1 - stronger, pricier,anthropic/claude-sonnet-4|Claude Sonnet 4 - creative,google/gemini-2.5-flash|Gemini 2.5 Flash - fast,z-ai/glm-5.3-flash|GLM 5.3 Flash - experimental cheap"
      # Reserved for a later real image integration. Current avatars are local CSS/emoji cards.
      - key: OPENROUTER_IMAGE_MODEL
        sync: false
      # Optional. Without these Markus gets "Download JSON" instead of saving.
      # Set the values in the Render dashboard, never in this file.
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_OWNER
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: GITHUB_BRANCH
        value: main
